<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта Вкусов Города | FlavorMap</title>
  
  <!-- Leaflet CSS (Карта) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.8);
      --accent-orange: #f97316;
      --accent-pink: #ec4899;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Боковая панель */
    #sidebar {
      width: 380px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: var(--bg-dark);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 1000;
      box-shadow: 10px 0 30px rgba(0,0,0,0.5);
      overflow-y: auto;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: -12px;
    }

    /* Фильтры по вкусам */
    .filter-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .flavor-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tag:hover, .tag.active {
      background: var(--accent-orange);
      border-color: var(--accent-orange);
      transform: translateY(-2px);
    }

    /* Карточки мест */
    .places-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .place-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .place-card:hover {
      border-color: var(--accent-pink);
      transform: scale(1.02);
    }

    .place-name {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .place-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(249, 115, 22, 0.2);
      color: var(--accent-orange);
      font-weight: 600;
    }

    /* Карта */
    #map {
      flex: 1;
      height: 100%;
    }

    /* Кастомизация кастомных поп-апов Leaflet */
    .leaflet-popup-content-wrapper {
      background: var(--bg-dark);
      color: var(--text-main);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .leaflet-popup-tip {
      background: var(--bg-dark);
    }

    @media (max-width: 768px) {
      body { flex-direction: column-reverse; }
      #sidebar { width: 100%; height: 45vh; }
      #map { height: 55vh; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <div>
      <h1 class="brand">FlavorMap 🍕</h1>
      <p class="subtitle">Карта вкусов и эстетичной еды</p>
    </div>

    <div>
      <div class="filter-title">Выбери профиль вкуса</div>
      <div class="flavor-tags">
        <button class="tag active" onclick="filterPlaces('all')">Все вкусы</button>
        <button class="tag" onclick="filterPlaces('umami')">🔥 Насыщенный Умами</button>
        <button class="tag" onclick="filterPlaces('sweet')">🍰 Десерты & Сладкое</button>
        <button class="tag" onclick="filterPlaces('spicy')">🌶️ Острое & Специи</button>
        <button class="tag" onclick="filterPlaces('coffee')">☕ Спешелти кофе</button>
      </div>
    </div>

    <div class="filter-title">Локации поблизости</div>
    <div class="places-list" id="places-container">
      <!-- Динамически заполняется через JS -->
    </div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. Данные локаций (пример)
    const places = [
      {
        id: 1,
        name: "Umami Ramen Bar",
        category: "umami",
        badge: "Умами / Азия",
        desc: "Густой бульон тонкотсу, домашняя лапша и сочные чашу.",
        lat: 55.7558,
        lng: 37.6173
      },
      {
        id: 2,
        name: "Sweet Bakery & Churros",
        category: "sweet",
        badge: "Десерты",
        desc: "Хрустящие чуррос с горячим шоколадом и авторские эклеры.",
        lat: 55.7600,
        lng: 37.6050
      },
      {
        id: 3,
        name: "Chili Pepper Bistro",
        category: "spicy",
        badge: "Острое / Мексика",
        desc: "Настоящие тако с гастрономической остротой 8/10.",
        lat: 55.7480,
        lng: 37.6250
      },
      {
        id: 4,
        name: "Brew & Roast Hub",
        category: "coffee",
        badge: "Спешелти Кофе",
        desc: "Воронка V60, спешелти зерно и круассаны на соленом масле.",
        lat: 55.7520,
        lng: 37.6320
      }
    ];

    // 2. Инициализация карты (Москва по умолчанию, можно менять)
    const map = L.map('map').setView([55.7539, 37.6208], 14);

    // Тёмная стильная подложка карты (CartoDB Dark Matter)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap & CARTO'
    }).addTo(map);

    let markers = [];

    // 3. Отрисовка заведений
    function renderPlaces(data) {
      const container = document.getElementById('places-container');
      container.innerHTML = '';
      
      // Очистка старых маркеров
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      data.forEach(place => {
        // Карточка в сайдбаре
        const card = document.createElement('div');
        card.className = 'place-card';
        card.innerHTML = `
          <div class="place-name">${place.name}</div>
          <div class="place-desc">${place.desc}</div>
          <span class="badge">${place.badge}</span>
        `;
        card.onclick = () => {
          map.flyTo([place.lat, place.lng], 16, { duration: 1.5 });
        };
        container.appendChild(card);

        // Маркер на карте
        const marker = L.marker([place.lat, place.lng])
          .addTo(map)
          .bindPopup(`<b>${place.name}</b><br>${place.desc}`);
        
        markers.push(marker);
      });
    }

    // 4. Фильтрация
    function filterPlaces(category) {
      // Подсвечиваем кнопки
      document.querySelectorAll('.tag').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (category === 'all') {
        renderPlaces(places);
      } else {
        const filtered = places.filter(p => p.category === category);
        renderPlaces(filtered);
      }
    }

    // Старт
    renderPlaces(places);
  </script>
</body>
</html>
